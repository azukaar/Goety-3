//file:noinspection InconsistentLineSeparators
plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.137'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = "${neo_version}"
    validateAccessTransformers = false
    
    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
        }
    }
    
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.main.java {
    exclude 'com/Polarice3/Goety/data/**'
    exclude 'com/Polarice3/Goety/init/ModLootInject.java'
}

repositories {
    maven {
        name = "CurseForge"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Curios"
        url = "https://maven.theillusivec4.top"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    flatDir {
        dirs 'runtime-mods'
    }
}

dependencies {
    // Mixin is provided by the NeoForge runtime; we only need the annotations on the compile classpath.
    // The Mixin annotation processor currently fails to remap targets under the NeoForge moddev setup,
    // which blocks compilation. We'll re-enable proper AP/remapping once the mod builds cleanly.
    compileOnly 'org.spongepowered:mixin:0.8.5'

    //JEI - Commented out until 1.21.1 version is available
    //compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    //compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    //runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    //Curios (required)
    compileOnly("top.theillusivec4.curios:curios-neoforge:${curio_version}+${minecraft_version}:api")
    runtimeOnly("top.theillusivec4.curios:curios-neoforge:${curio_version}+${minecraft_version}")

    //Patchouli - Commented out until 1.21.1 version is available
    //compileOnly("vazkii.patchouli:Patchouli:${minecraft_version}-${patchouli_version}:api")
    //runtimeOnly("vazkii.patchouli:Patchouli:${minecraft_version}-${patchouli_version}")

    //Jade
    //implementation("curse.maven:jade-324717:6855440")

    //Botania - Commented out until 1.21.1 version is available
    //compileOnly("vazkii.botania:Botania:${minecraft_version}-NEOFORGE-SNAPSHOT")

    //Serene Seasons - Commented out until 1.21.1 version is available
    //compileOnly("curse.maven:serene-seasons-291874:5790653")

    //Testing Only
    runtimeOnly("curse.maven:yeetus-635427:4680832")
    runtimeOnly("curse.maven:jeed-532286:4599236")
    runtimeOnly("curse.maven:worldedit-225608:4586218")
    runtimeOnly("curse.maven:mob-battle-mod-268746:6596542")
    runtimeOnly("curse.maven:lionfish-api-1001614:5922047")
    runtimeOnly("maven.modrinth:l_enders-cataclysm:NvvXful4")
    runtimeOnly("curse.maven:retro-damage-indicators-1003431:5268035")
    runtimeOnly("curse.maven:kiwi-303657:4688568")
    runtimeOnly("curse.maven:wiki-zoomer-383277:4576732")
    runtimeOnly("curse.maven:geckolib-388172:5414523")
    runtimeOnly("curse.maven:born-in-chaos-686437:6833957")
    runtimeOnly("curse.maven:framework-549225:5180972")
    runtimeOnly("curse.maven:configured-457570:5180900")
    runtimeOnly("curse.maven:spark-361579:4738952")
    runtimeOnly("curse.maven:illage-and-spillage-finally-ported-1079714:6156035")
    runtimeOnly("curse.maven:free-cam-557076:4643128")
    runtimeOnly("curse.maven:mob-battle-extra-853296:4810120")
    runtimeOnly("curse.maven:puzzles-lib-495476:6918565")
    runtimeOnly("curse.maven:illager-invasion-891324:6192869")
    runtimeOnly("curse.maven:citadel-331936:6702068")
    runtimeOnly("curse.maven:domestication-innovation-591149:4911955")
    runtimeOnly("curse.maven:huge-structure-blocks-474114:4803547")
    runtimeOnly("curse.maven:guard-villagers-360203:6793945")
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs": "goety.mixins.json"
        ])
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
